# LiteLLM gateway configuration. Managed pool entries live between the
# MANAGED BLOCK markers and are regenerated by generate-models.sh; the
# flash entry and all settings below the markers are manual.
model_list:
  # BEGIN MANAGED BLOCK
  - model_name: cascade
    litellm_params:
      model: openai/big-pickle
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/ZEN_API_KEY
  - model_name: cascade
    litellm_params:
      model: openai/mimo-v2.5-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/ZEN_API_KEY
  - model_name: cascade
    litellm_params:
      model: openai/ling-3.0-flash-fin-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/ZEN_API_KEY
  - model_name: cascade
    litellm_params:
      model: openai/nemotron-3-ultra-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/ZEN_API_KEY
  - model_name: cascade
    litellm_params:
      model: openai/nemotron-3.5-lightning-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/ZEN_API_KEY
  # END MANAGED BLOCK
  # tier 1: Z.AI coding plan flash (terminal tier, manual)
  - model_name: flash
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY

# After GATEWAY.md verification step V2: add model_info.max_input_tokens /
# max_output_tokens per deployment, sized from the context window ledger.

router_settings:
  routing_strategy: least-busy
  num_retries: 4
  timeout: 300
  cooldown_time: 300
  context_window_fallbacks:
    - cascade: ["flash"]

litellm_settings:
  fallbacks:
    - cascade: ["flash"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
