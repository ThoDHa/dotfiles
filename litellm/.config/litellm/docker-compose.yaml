services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable   # pin a concrete vX.Y.Z-stable tag in V3
    container_name: litellm-gateway
    command: --config /app/config.yaml --host 0.0.0.0 --port 4000
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    env_file: env
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 5s
      retries: 3
