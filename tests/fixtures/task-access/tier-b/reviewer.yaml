# Tier-B fixture dispatch config: reviewer (ORCH-4-9-1 skeleton; the
# ORCH-4-9-4 representative executions run under this file).
#
# Realizes the verb map's target reviewer map: the report write channel
# stays CLI-only, the CLI read verbs are allowed (last-match-wins exception
# allows after the catch-all deny), and the fixture denial tail is appended.
#
# Rule semantics are opencode's: ordered rules, the LAST matching rule
# wins, so the denial tail overrides everything above it.
#
# Boundary: these rules deny the edit and shell routes. opencode maps have
# no read action, so the native read tool is covered by the transcript
# audit (tests/task-access/audit-transcript.sh), not denied here. This
# fixture proves contract sufficiency and role discipline; it is not a
# filesystem boundary, and enforcement is ORCH-4-10's work.
description: "Tier-B fixture config: reviewer under CLI-only task access"
mode: subagent
permissions:
  - { action: edit, resource: "*", effect: deny }
  - { action: edit, resource: "/tmp/llm/reports/**", effect: allow }
  - { action: shell, resource: "*", effect: deny }
  - { action: shell, resource: "git status *", effect: allow }
  - { action: shell, resource: "git diff *", effect: allow }
  - { action: shell, resource: "git log *", effect: allow }
  - { action: shell, resource: "git show *", effect: allow }
  - { action: shell, resource: "git rev-parse *", effect: allow }
  - { action: shell, resource: "git worktree list *", effect: allow }
  - { action: shell, resource: "git -C * status *", effect: allow }
  - { action: shell, resource: "git -C * log *", effect: allow }
  - { action: shell, resource: "git -C * diff *", effect: allow }
  - { action: shell, resource: "git -C * show *", effect: allow }
  - { action: shell, resource: "git -C * worktree list *", effect: allow }
  - { action: shell, resource: "ls *", effect: allow }
  - { action: shell, resource: "cat *", effect: allow }
  - { action: shell, resource: "grep *", effect: allow }
  - { action: shell, resource: "wc *", effect: allow }
  - { action: shell, resource: "tasks report *", effect: allow }
  - { action: shell, resource: "tasks show *", effect: allow }
  - { action: shell, resource: "tasks list *", effect: allow }
  - { action: shell, resource: "tasks reports *", effect: allow }
  - { action: shell, resource: "* *.env*", effect: deny }
  - { action: subagent, resource: "*", effect: deny }
  - { action: subagent, resource: "scout", effect: allow }
  - { action: external_directory, resource: "/tmp/**", effect: allow }
# fixture denial tail (fixture-only rules; not part of the target map)
  - { action: edit, resource: ".tasks/**", effect: deny }
  - { action: shell, resource: "*cat *.tasks*", effect: deny }
  - { action: shell, resource: "*grep *.tasks*", effect: deny }
  - { action: shell, resource: "*ls *.tasks*", effect: deny }
  - { action: shell, resource: "*wc *.tasks*", effect: deny }
  - { action: shell, resource: "*find *.tasks*", effect: deny }
  - { action: shell, resource: "*sed *.tasks*", effect: deny }
  - { action: shell, resource: "*awk *.tasks*", effect: deny }
  - { action: shell, resource: "*head *.tasks*", effect: deny }
  - { action: shell, resource: "*tail *.tasks*", effect: deny }
