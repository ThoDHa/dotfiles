# Raise escape-time before anything else runs: at server start tmux sends
# DA1/DA2 capability queries to the outer terminal, and with the 3.5+ default
# of 10ms the replies fragment and leak into the first pane as literal text.
# tmux-sensible later resets this to 0, so it is set again after the tpm run
# line below. See tmux/tmux#3845.
set -sg escape-time 50

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-Space
bind-key Space send-prefix

# start windows and panes at 1, not 0
set -g base-index 1

# This will repack the windows
set-option -g renumber-windows on
setw -g pane-base-index 1

set-option -g status-position bottom
set-option -g status-justify left

set -g pane-active-border-style bg=white,fg=black
set -g pane-border-style fg=green
set -g pane-active-border-style "bg=default fg=yellow"

# tell Tmux that outside terminal supports true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

#set-option -g default-terminal "screen-256color"

# Set scroll mode, and copy like VIM
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Set that v and s does splits instead
bind v split-window -h -c '#{pane_current_path}'
bind b split-window -v -c '#{pane_current_path}'

# Bind hjkl to switching panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# bind new keys to change pane sizes
bind-key -r M-j resize-pane -D 10
bind-key -r M-k resize-pane -U 10
bind-key -r M-h resize-pane -L 10
bind-key -r M-l resize-pane -R 10

bind-key N send-keys '('
bind-key P send-keys ')'

set-option -g default-command $SHELL 
set-option -g default-shell $SHELL

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Keep boot off: the systemd unit it generates runs `tmux kill-server` in its
# ExecStop, which kills whichever server is running on the default socket,
# including a brand new one started right after `tmux kill-server`.
set -g @continuum-boot 'off'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'nvim'

set -g @rose_pine_directory 'on'
set -g @rose_pine_show_current_program 'on'

# Only these two separators render here. @rose_pine_right_separator is used
# solely by the user, host and date modules, none of which are enabled, and
# @rose_pine_window_separator would switch rose-pine to a branch that does
# @rose_pine_left_separator's job instead of adding to it.
#
# The field separator is a space rather than empty because rose-pine falls back
# to its default whenever an option value is empty, which would restore the
# two-space separator this is meant to remove.
set -g @rose_pine_field_separator ' '
set -g @rose_pine_left_separator ': '

# Transparency has to be requested through rose-pine rather than by setting
# status-style directly: the theme sets that option itself when tpm runs, so a
# plain `set -g status-style bg=default` earlier in this file is overwritten.
# The color option is required alongside it, defaulting to color0 otherwise.
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'

# The clock lives here rather than in @rose_pine_date_time because rose-pine
# renders its own modules in a fixed order that puts the date after this
# section, and the date is wanted ahead of the CPU readout.
#
# tmux-cpu rewrites status-right in place, substituting these placeholders for
# its own #() calls, so its plugin line must stay after rose-pine's: rose-pine
# is what puts the placeholders into status-right in the first place.
set -g @rose_pine_status_right_prepend_section '%a %Y-%m-%d %H:%M 󰃰   #{cpu_percentage} 󰍛 #{ram_percentage}'

# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override tmux-sensible's escape-time 0: with tmux >= 3.5 a near-zero
# escape-time fragments delayed OSC 10/11 color replies, leaking garbage
# like "bcbc/baba" into panes on session switch. See tmux/tmux#3845.
set -sg escape-time 50

# rose-pine builds window-status-format without #F, which drops tmux's window
# flags: activity, bell, silence, last-window and zoom all become invisible.
# Append them back rather than restating the format, so the theme keeps
# ownership of the colors. Must follow the tpm run above, since that is where
# rose-pine sets the format. The current window shows zoom only: its #F would
# be a permanent '*' that says nothing the highlight does not already say.
setw -ga window-status-format ' #F'
setw -ga window-status-current-format '#{?window_zoomed_flag, Z,}'
